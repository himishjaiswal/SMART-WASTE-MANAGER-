<!DOCTYPE html>
<html>
<head><title>Schedule Results</title></head>
<body>
    <h2>Schedule results</h2>
    <a href="/dashboard">Back to dashboard</a>

    <br><br>
    <table border="1" cellpadding="5">
        <tr>
            <th>Request</th><th>Stop</th><th>Waste</th><th>Priority</th>
            <th>Algorithm</th><th>Start</th><th>Completion</th>
            <th>Waiting</th><th>Turnaround</th>
        </tr>
        {% for r in rows %}
        <tr>
            <td>{{ r[0] }}</td><td>{{ r[1] }}</td><td>{{ r[2] }}</td><td>{{ r[3] }}</td>
            <td>{{ r[4] }}</td><td>{{ r[5] }}</td><td>{{ r[6] }}</td>
            <td>{{ r[7] }}</td><td>{{ r[8] }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
